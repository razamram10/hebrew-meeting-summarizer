<title>סיכום פגישה</title><style>body{max-width:42rem;margin:3rem auto;padding:1rem;font:18px/1.6 Arial;color:#203449}h2{border-bottom:1px solid #ccd}</style><body><h1>פיילוט לטופס משוב</h1>
<h2>החלטות</h2>
<p>מתחילים בפיילוט עם צוות אחד.</p>
<h2>משימות</h2>
<p>דן יכין טיוטת טופס עד יום שלישי.</p>
<h2>שאלות פתוחות</h2>
<p>מועד ההשקה ייקבע לאחר קבלת משוב מהצוות.</p></body></html>
